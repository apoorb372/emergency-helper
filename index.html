<!DOCTYPE html>
<html>
<head>
<title>AI Emergency Helper PRO MAX</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #ff4d4d, #ff9966);
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

h1 {
  margin-bottom: 15px;
}

.section {
  margin: 20px 0;
}

button {
  padding: 12px 18px;
  margin: 8px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  transition: 0.3s;
}

.main-btn {
  background: white;
  color: #ff4d4d;
  font-weight: bold;
}

.main-btn:hover {
  transform: scale(1.05);
}

.emergency-btn {
  background: rgba(255,255,255,0.2);
  color: white;
}

.emergency-btn:hover {
  background: white;
  color: #ff4d4d;
}

.card {
  background: white;
  color: black;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

#timer {
  font-size: 22px;
  font-weight: bold;
  color: #ff4d4d;
}

.footer {
  margin-top: 30px;
  font-size: 14px;
  opacity: 0.8;
}
</style>

</head>

<body>

<div class="container">

  <h1>🚨 AI Emergency Helper</h1>
  <p>Instant help when every second matters</p>

  <div class="section">
    <button class="main-btn" onclick="startListening()">🎤 Speak Emergency</button>
  </div>

  <div class="section">
    <button class="emergency-btn" onclick="handleEmergency('accident')">🚗 Accident</button>
    <button class="emergency-btn" onclick="handleEmergency('heart')">❤️ Heart Attack</button>
    <button class="emergency-btn" onclick="handleEmergency('fire')">🔥 Fire</button>
    <button class="emergency-btn" onclick="handleEmergency('snake')">🐍 Snake Bite</button>
  </div>

  <div id="result"></div>

  <div class="card">
    📞 <b>Emergency Numbers (India)</b><br><br>
    Ambulance: 108<br>
    Police: 100<br>
    Fire: 101
  </div>

  <div class="card">
    ⏱️ CPR Timer: <span id="timer">0</span> sec
  </div>

  <div class="card">
    <a href="tel:108">
      <button class="main-btn">📞 Call Ambulance</button>
    </a>
  </div>

  <div class="card">
    <button onclick="shareLocation()">📍 Share My Location</button>
  </div>

  <div class="footer">
    Built for saving lives ❤️
  </div>

</div>

<script>

// ⏱️ Timer
let timer = 0;
let interval;

function startTimer() {
  timer = 0;
  clearInterval(interval);
  interval = setInterval(() => {
    timer++;
    document.getElementById("timer").innerText = timer;
  }, 1000);
}

// 🔊 Voice Output
function speak(text) {
  let speech = new SpeechSynthesisUtterance(text);
  window.speechSynthesis.speak(speech);
}

// 🎤 Voice Input
function startListening() {
  let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";

  recognition.onresult = function(event) {
    let speech = event.results[0][0].transcript.toLowerCase();

    if (speech.includes("heart")) handleEmergency("heart");
    else if (speech.includes("accident")) handleEmergency("accident");
    else if (speech.includes("fire")) handleEmergency("fire");
    else if (speech.includes("snake")) handleEmergency("snake");
    else speak("Sorry, I didn't understand");
  };

  recognition.start();
}

// 📍 Location
function shareLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      let lat = position.coords.latitude;
      let lon = position.coords.longitude;
      let link = "https://www.google.com/maps?q=" + lat + "," + lon;
      window.open(link, "_blank");
    });
  } else {
    alert("Location not supported");
  }
}

// ⏱️ No Response Alert
let responseTimer;

function startResponseTimer() {
  clearTimeout(responseTimer);
  responseTimer = setTimeout(() => {
    let confirmCall = confirm("No response detected! Call ambulance?");
    if (confirmCall) {
      window.location.href = "tel:108";
    }
  }, 10000);
}

// 🧠 Logic
function handleEmergency(type) {
  startResponseTimer();

  let message = "";

  if (type === "heart") {
    startTimer();
    message = "Start CPR. Push chest 100 to 120 times per minute.";
  }
  else if (type === "accident") {
    message = "Do not move injured. Call ambulance immediately.";
  }
  else if (type === "fire") {
    message = "Stay low. Exit immediately and use extinguisher.";
  }
  else if (type === "snake") {
    message = "Keep calm. Do not suck venom. Go to hospital.";
  }

  document.getElementById("result").innerHTML =
    "<div class='card'>" + message + "</div>";

  speak(message);
}

</script>

</body>
</html>
