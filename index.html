<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Emergency Helper</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
  text-align: center;
}

.container {
  margin-top: 10%;
}

h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

button {
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: #ff4b5c;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #ff1e3c;
}

#status {
  margin-top: 20px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
  <h1>🚨 AI Emergency Helper</h1>
  <p>Your smart safety assistant</p>

  <button onclick="startListening()">🎤 Start Voice</button>
  <button onclick="triggerEmergency()">🚨 Emergency Alert</button>

  <div id="status">Status: Ready</div>
</div>

<script>

// 🎤 Voice Recognition
function startListening() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";

  recognition.start();
  document.getElementById("status").innerText = "Listening...";

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript.toLowerCase();
    document.getElementById("status").innerText = "You said: " + text;

    if (text.includes("help") || text.includes("emergency")) {
      triggerEmergency();
    } else {
      speak("I am here to help you. Stay calm.");
    }
  };
}

// 🔊 Text to Speech
function speak(msg) {
  const speech = new SpeechSynthesisUtterance(msg);
  speech.lang = "en-US";
  window.speechSynthesis.speak(speech);
}

// 🚨 Emergency System
function triggerEmergency() {
  speak("Emergency detected. Please respond within 10 seconds.");
  document.getElementById("status").innerText = "Emergency triggered! Waiting for response...";

  startCountdown();
}

// ⏱️ Countdown system
function startCountdown() {
  let time = 10;

  const interval = setInterval(() => {
    document.getElementById("status").innerText =
      "Respond within " + time + " seconds";

    time--;

    if (time < 0) {
      clearInterval(interval);
      noResponseAction();
    }
  }, 1000);
}

// 🚨 No response action (safe simulation)
function noResponseAction() {
  speak("No response detected. Sending alert notification.");
  document.getElementById("status").innerText =
    "⚠️ Alert Sent (Simulation Mode)";

  // 📍 Location (browser permission)
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((pos) => {
      console.log("Location:", pos.coords.latitude, pos.coords.longitude);
    });
  }
}

</script>

</body>
</html>
